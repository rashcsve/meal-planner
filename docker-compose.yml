services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: meal_planner_app
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: meal_planner
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal_planner_app -d meal_planner"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  db_data:
